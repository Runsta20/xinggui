  // 心形参数曲线（单位化，屏幕坐标 y 向下）
  function heart(t) {
    var x = 16 * Math.pow(Math.sin(t), 3);
    var y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
    return { x: x / 17, y: y / 17 };
  }

  function makeNoise(size, alpha) {
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var g = c.getContext('2d');
    var img = g.createImageData(size, size);
    var d = img.data;
    for (var i = 0; i < d.length; i += 4) {
      var v = 80 + Math.random() * 175;
      d[i] = d[i + 1] = d[i + 2] = v;
      d[i + 3] = Math.random() * 255 * alpha;
    }
    g.putImageData(img, 0, 0);
    return c;
  }

  function makeRays(R) {
    var size = Math.ceil(R * 2);
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var g = c.getContext('2d');
    g.translate(R, R);
    for (var i = 0; i < 24; i++) {
      var a = (i / 24) * TAU + Math.random() * 0.1;
      var w = 0.01 + Math.random() * 0.045;
      var len = R * (0.6 + Math.random() * 0.4);
      var grad = g.createLinearGradient(0, 0, Math.cos(a) * len, Math.sin(a) * len);
      grad.addColorStop(0, 'rgba(255,190,245,' + (0.14 + Math.random() * 0.18).toFixed(2) + ')');
      grad.addColorStop(0.55, 'rgba(190,120,235,' + (0.04 + Math.random() * 0.05).toFixed(3) + ')');
      grad.addColorStop(1, 'rgba(120,80,220,0)');
      g.fillStyle = grad;
      g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, len, a - w, a + w); g.closePath(); g.fill();
    }
    return { cv: c, r: R };
  }

  function makeRing(R, ticks, color, dash) {
    var size = Math.ceil(R * 2) + 2;

    c.width = c.height = size;
    var g = c.getContext('2d');

      g.setLineDash(dash);

      g.beginPath(); g.arc(0, 0, R * 0.96, 0, TAU); g.stroke();
      g.setLineDash([]);
    }
    for (var i = 0; i < ticks; i++) {
      var a = (i / ticks) * TAU;
      var big = i % 5 === 0;
      var r1 = R * (big ? 0.93 : 0.965);

      g.lineWidth = big ? 1.4 : 1;
      g.beginPath();
      g.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
      g.lineTo(Math.cos(a) * R * 1.02, Math.sin(a) * R * 1.02);
      g.stroke();
    }
    return { cv: c, r: size / 2 };
  }

    for (var i = 0; i < n; i++) {
      hearts.push({
        t: rnd() * TAU,
        p: rnd(),
        speed: 0.07 + rnd() * 0.12,
        len: 0.10 + rnd() * 0.22,
        w: 0.6 + rnd() * 1.5,
        alpha: 0.35 + rnd() * 0.6,
        hueShift: (rnd() - 0.5) * 70,
        shape: (rnd() * 4) | 0,
        size: 0.8 + rnd() * 2.2
      });
    }
    // 流星雨：从中心向外飞，带透视
    meteors = [];
    var mn = Math.round(70 * quality);
    for (var j = 0; j < mn; j++) meteors.push(newMeteor(true));
    dust = [];
    var dn = Math.round(110 * quality);
    for (var k = 0; k < dn; k++) dust.push({ x: rnd(), y: rnd(), r: 0.3 + rnd() * 1.5, ph: rnd() * TAU, sp: 0.2 + rnd() * 0.8 });
  }

  function newMeteor(spread) {
    return {
      a: rnd() * TAU,
      z: spread ? rnd() : 0.02 + rnd() * 0.05,   // 0 近 1 远
      v: 0.35 + rnd() * 0.75,
      len: 0.05 + rnd() * 0.12,
      hue: rnd() < 0.35 ? 190 + rnd() * 40 : 285 + rnd() * 45,
      w: 0.6 + rnd() * 1.8
    };
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.max(1, Math.round(W * DPR));
    cv.height = Math.max(1, Math.round(H * DPR));
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W / 2; cy = H * 0.47;

    vignette = ctx.createRadialGradient(cx, cy, Math.min(W, H) * 0.16, cx, cy, Math.max(W, H) * 0.84);
    vignette.addColorStop(0, 'rgba(3,0,10,0)');
    vignette.addColorStop(0.68, 'rgba(3,0,10,0.26)');
    vignette.addColorStop(1, 'rgba(3,0,10,0.88)');

    glowGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(80, Math.min(W, H) * 0.24));
    glowGrad.addColorStop(0, 'rgba(255,190,250,.66)');
    glowGrad.addColorStop(.28, 'rgba(245,80,200,.32)');
    glowGrad.addColorStop(.62, 'rgba(150,70,235,.12)');
    glowGrad.addColorStop(1, 'rgba(120,60,220,0)');

    var R = Math.hypot(W, H) * 0.5;
    rays = makeRays(R * 1.05);
    ringA = makeRing(Math.min(W, H) * 0.30, 72, 'rgba(170,210,255,0.20)', [2, 9]);
    ringB = makeRing(Math.min(W, H) * 0.39, 48, 'rgba(235,170,240,0.16)', null);

    noisePat = null; scanPat = null;
    try { noisePat = ctx.createPattern(makeNoise(140, 0.6), 'repeat'); } catch (e) {}
    var sc = document.createElement('canvas');
    sc.width = 4; sc.height = 4;
    var sg = sc.getContext('2d');
    sg.fillStyle = 'rgba(255,255,255,0.05)';
    sg.fillRect(0, 0, 4, 1);
    try { scanPat = ctx.createPattern(sc, 'repeat'); } catch (e) {}

    build();
  }

  function drawBg(t) {
    if (plate.complete && plate.naturalWidth) {
      var pw = plate.naturalWidth, ph = plate.naturalHeight;
      var sc = Math.max(W / pw, H / ph) * (1.05 + zoom * 0.03);
      var dw = pw * sc, dh = ph * sc;
      ctx.globalAlpha = 0.86;
      ctx.drawImage(plate, (W - dw) / 2 + Math.sin(rot * 0.5) * 10, (H - dh) / 2 + Math.cos(rot * 0.4) * 6, dw, dh);
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = '#050010'; ctx.fillRect(0, 0, W, H);
    }
  }

  function drawRays(t) {
    if (!rays) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.5 + 0.15 * Math.sin(t * 0.9);
    ctx.translate(cx, cy);
    ctx.rotate(t * 0.03 + rot * 0.3);
    // 色相随时间偏移：给放射光染上冷暖
    ctx.drawImage(rays.cv, -rays.r, -rays.r, rays.r * 2, rays.r * 2);
    ctx.restore();
  }

  function drawGlow(t) {
    var pulse = 0.85 + 0.15 * Math.sin(t * 2.2) + ripples.length * 0.05;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = Math.min(1, 0.85 * pulse);
    ctx.fillStyle = glowGrad;
    ctx.beginPath(); ctx.arc(cx, cy, Math.max(80, Math.min(W, H) * 0.24), 0, TAU); ctx.fill();
    ctx.restore();
  }

  // 星芒：4 尖 / 6 尖 / 圆点 / 十字
  function sparkle(x, y, r, hue, alpha, shape) {
    if (r <= 0.3) return;
    ctx.fillStyle = 'hsla(' + hue + ',100%,78%,' + alpha.toFixed(3) + ')';
    if (shape === 2) {
      ctx.beginPath(); ctx.arc(x, y, r * 0.85, 0, TAU); ctx.fill();
      return;
    }
    var spikes = shape === 1 ? 3 : (shape === 3 ? 2 : 2);
    for (var i = 0; i < spikes; i++) {
      var a = (i / spikes) * Math.PI * 2 + (shape === 1 ? 0.5 : 0);
      var rr = r * 2.6;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a - 0.16) * 0, y + Math.sin(a - 0.16) * 0);
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
      ctx.lineTo(x + Math.cos(a + 0.16) * 0, y + Math.sin(a + 0.16) * 0);
      ctx.closePath();
      ctx.fill();
    }
    ctx.beginPath(); ctx.arc(x, y, r * 0.7, 0, TAU); ctx.fill();
  }

  function drawHeart(t) {
    var maxR = Math.min(W, H) * 0.72 * zoom;
    var baseHue = 292 + 22 * Math.sin(t * 0.22);   // 主色缓慢摆动
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (var pass = 0; pass < 2; pass++) {
      for (var i = 0; i < hearts.length; i++) {
        var s = hearts[i];
        var u = (s.p + t * s.speed) % 1;
        if (u < 0.015) continue;
        var scale = 0.16 + u * 0.95;
        var tailScale = 0.16 + Math.max(0, u - s.len) * 0.95;
        var p1 = heart(s.t);
        var x = cx + p1.x * maxR * scale;
        var y = cy + p1.y * maxR * scale;
        var xt = cx + p1.x * maxR * tailScale;
        var yt = cy + p1.y * maxR * tailScale;
        if (x < -60 || x > W + 60 || y < -60 || y > H + 60) continue;
        var fade = Math.min(1, u * 4.5, (1 - u) * 14);
        if (fade <= 0.01) continue;
        var hue = (baseHue + s.hueShift + u * 45) % 360;
        if (hue < 0) hue += 360;
        var alpha = s.alpha * (0.10 + 0.95 * u * u) * fade;
        if (pass === 0) {
          ctx.strokeStyle = 'hsla(' + hue + ',100%,72%,' + (alpha * 0.20).toFixed(3) + ')';
          ctx.lineWidth = s.w * 5;
        } else {
          ctx.strokeStyle = 'hsla(' + hue + ',100%,80%,' + alpha.toFixed(3) + ')';
          ctx.lineWidth = s.w * (0.45 + 0.8 * u);
        }
        ctx.beginPath();
        ctx.moveTo(xt, yt);
        ctx.lineTo(x, y);
        ctx.stroke();
        // 尾部星芒
        if (pass === 1 && u > 0.72 && s.size > 1.4) {
          sparkle(x, y, s.size * (0.5 + u * 0.6), hue, alpha * 0.9, s.shape);
        }
      }
    }
    ctx.restore();
  }

  // 心形轮廓脉冲（淡）
  function drawHeartOutline(t) {
    var maxR = Math.min(W, H) * 0.72 * zoom;
    var baseHue = 292 + 22 * Math.sin(t * 0.22);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'hsla(' + baseHue + ',100%,72%,0.14)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (var i = 0; i <= 96; i++) {
      var tt = (i / 96) * TAU;
      var p = heart(tt + rot * 0.15);
      var x = cx + p.x * maxR * 1.02;
      var y = cy + p.y * maxR * 1.02;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }

  function drawMeteors(dt, t) {
    var maxR = Math.hypot(W, H) * 0.75;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (var i = 0; i < meteors.length; i++) {
      var m = meteors[i];
      m.z -= dt * (0.10 + m.v * 0.12);   // 越来越近
      if (m.z <= 0.02) { meteors[i] = newMeteor(false); continue; }
      var depth = 1 - m.z;                 // 0 远 1 近
      var r = maxR * Math.pow(depth, 2.2) * zoom + 6;
      var ang = m.a + rot;
      var dx = Math.cos(ang), dy = Math.sin(ang) * 0.95;
      var x = cx + dx * r, y = cy + dy * r;
      var tailLen = r * (0.12 + m.len * (0.4 + depth));
      var x0 = cx + dx * Math.max(0, r - tailLen), y0 = cy + dy * Math.max(0, r - tailLen);
      var alpha = Math.min(1, 0.12 + depth * 0.95);
      var g = ctx.createLinearGradient(x0, y0, x, y);
      g.addColorStop(0, 'hsla(' + m.hue + ',100%,80%,0)');
      g.addColorStop(0.65, 'hsla(' + m.hue + ',100%,82%,' + (alpha * 0.5).toFixed(3) + ')');
      g.addColorStop(1, 'hsla(' + m.hue + ',100%,92%,' + alpha.toFixed(3) + ')');
      ctx.strokeStyle = g;
      ctx.lineWidth = m.w * (0.5 + depth * 2.6);
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x, y); ctx.stroke();
      // 头部星芒
      if (depth > 0.55) {
        sparkle(x, y, 1.6 + depth * 3.4, m.hue, alpha, (i % 4));
      }
    }
    ctx.restore();
  }

  function drawDust(t) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < dust.length; i++) {
      var p = dust[i];
      var x = p.x * W + Math.sin(t * 0.2 + p.ph) * 18;
      var y = (p.y * H + t * p.sp * 14) % H + Math.cos(t * 0.17 + p.ph) * 12;
      var hue = 280 + 60 * Math.sin(t * 0.3 + p.ph);
      ctx.globalAlpha = 0.05 + 0.13 * Math.abs(Math.sin(t * 0.9 + p.ph));
      ctx.fillStyle = 'hsl(' + hue + ',90%,80%)';
      ctx.beginPath(); ctx.arc(x, y, p.r, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  function drawHud(t) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.5;
    ctx.translate(cx, cy);
    if (ringA) { ctx.save(); ctx.rotate(-t * 0.12 + rot * 0.5); ctx.drawImage(ringA.cv, -ringA.r, -ringA.r, ringA.r * 2, ringA.r * 2); ctx.restore(); }
    if (ringB) { ctx.save(); ctx.rotate(t * 0.07 - rot * 0.35); ctx.globalAlpha = 0.3; ctx.drawImage(ringB.cv, -ringB.r, -ringB.r, ringB.r * 2, ringB.r * 2); ctx.restore(); }
    ctx.globalAlpha = 0.45;
    var a0 = (t * 0.5) % TAU;
    ctx.strokeStyle = 'rgba(150,235,255,0.5)';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0, 0, Math.min(W, H) * 0.345, a0, a0 + 0.5); ctx.stroke();
    ctx.restore();
  }

  function drawRipples(dt) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = ripples.length - 1; i >= 0; i--) {
      var r = ripples[i];
      r.r += 300 * dt; r.a -= dt * 0.85;
      if (r.a <= 0) { ripples.splice(i, 1); continue; }
      ctx.strokeStyle = 'rgba(255,170,245,' + (r.a * 0.45).toFixed(3) + ')';
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
      ctx.strokeStyle = 'rgba(150,235,255,' + (r.a * 0.26).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r * 0.7, 0, TAU); ctx.stroke();
    }
    ctx.restore();
  }

  function drawFilm() {
    if (noisePat) {
      ctx.save();
      ctx.globalCompositeOperation = 'overlay';
      ctx.globalAlpha = 0.20;
      var ox = (Math.random() * 140) | 0, oy = (Math.random() * 140) | 0;
      ctx.translate(-ox, -oy);
      ctx.fillStyle = noisePat;
      ctx.fillRect(0, 0, W + 160, H + 160);
      ctx.restore();
    }
    if (scanPat) {
      ctx.save();
      ctx.globalAlpha = 0.09;
      ctx.fillStyle = scanPat;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  function drawReadout(t) {
    var deg = ((rot * 180 / Math.PI) % 360 + 360) % 360;
    var hue = Math.round(292 + 22 * Math.sin(t * 0.22));
    ctx.save();
    ctx.fillStyle = 'hsla(' + hue + ',90%,78%,0.42)';
    ctx.font = '10px ui-monospace,Menlo,Consolas,monospace';
    ctx.fillText('HEART NEBULA // SHOWER ACTIVE', 14, H * 0.5 - 26);
    ctx.fillText('ROT ' + deg.toFixed(1) + '°   ZOOM ' + zoom.toFixed(2) + 'x   HUE ' + hue, 14, H * 0.5 - 12);
    ctx.fillText('FPS ' + Math.round(measured) + '   MODE ' + (quality < 1 ? 'ECO' : 'MAX'), 14, H * 0.5 + 2);
    ctx.restore();
  }

  function loop(now) {
    if (lastT === null) lastT = now;
    var dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;

    if (!dragging) rot += rotVel * dt;
    rotVel *= Math.pow(0.92, dt * 60);
    if (idleAt && now - idleAt > 2500 && Math.abs(rotVel) < 0.02) rot += 0.02 * dt;
    zoom += (zoomTarget - zoom) * Math.min(1, dt * 6);
    if (!paused) time += dt;

    drawBg(time);
    drawRays(time);
    drawGlow(time);
    drawDust(time);
    drawHeartOutline(time);
    drawHeart(time);
    drawMeteors(paused ? 0 : dt, time);
    drawHud(time);
    drawRipples(paused ? 0 : dt);
    drawFilm();
    drawReadout(time);

    frames++;
    if (now - fpsAt > 1000) {
      measured = frames * 1000 / (now - fpsAt);
      frames = 0; fpsAt = now;
      if (measured < 42 && quality > 0.55) { quality = 0.6; build(); }
    }
    raf = requestAnimationFrame(loop);
  }

  function start() {
    cancelAnimationFrame(raf);
    lastT = null;
    if (!document.hidden) raf = requestAnimationFrame(loop);
  }

  cv.addEventListener('pointerdown', function (e) {
    dragging = true; lastX = e.clientX; idleAt = 0;
    cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - lastX;
    rotVel = dx * 0.004; rot += dx * 0.004; lastX = e.clientX;
  });
  cv.addEventListener('pointerup', function () { dragging = false; idleAt = performance.now(); });
  cv.addEventListener('pointercancel', function () { dragging = false; idleAt = performance.now(); });

  cv.addEventListener('wheel', function (e) {
    zoomTarget = Math.max(0.6, Math.min(2.4, zoomTarget * (e.deltaY > 0 ? 0.92 : 1.08)));
    e.preventDefault();
  }, { passive: false });

  cv.addEventListener('touchstart', function (e) {
    if (e.touches.length === 2) pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  }, { passive: true });
  cv.addEventListener('touchmove', function (e) {
    if (e.touches.length === 2 && pinch) {
      var d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      zoomTarget = Math.max(0.6, Math.min(2.4, zoomTarget * (d / pinch)));
      pinch = d;
    }
  }, { passive: true });
  cv.addEventListener('touchend', function () { pinch = 0; });

  var tapT = 0;
  cv.addEventListener('click', function (e) {
    var now = performance.now();
    if (now - tapT < 280) {
      paused = !paused;
      hint.textContent = paused ? 'PAUSED · TAP TWICE TO RESUME' : 'HEART OF STARS · DRAG · PINCH · TAP';
      hint.classList.remove('off');
      clearTimeout(hint._t);
      hint._t = setTimeout(function () { hint.classList.add('off'); }, 1600);
      tapT = 0;
      return;
    }
    tapT = now;
    ripples.push({ x: e.clientX, y: e.clientY, r: 8, a: 1 });
    if (ripples.length > 6) ripples.shift();
  });

  document.addEventListener('visibilitychange', start);
  window.addEventListener('resize', function () { resize(); start(); });
  window.addEventListener('orientationchange', function () { setTimeout(function () { resize(); start(); }, 240); });

  resize();
  start();
  setTimeout(function () { hint.classList.add('off'); }, 4200);
})();
</script>
</body>
</html>
